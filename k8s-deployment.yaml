apiVersion: apps/v1
kind: Deployment
metadata:
  name: time-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: time-app
  template:
    metadata:
      labels:
        app: time-app
    spec:
      containers:
        - name: time-app
          image: jay16nair/time-app:latest
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: time-app-service
spec:
  type: NodePort
  selector:
    app: time-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30007
      protocol: TCP
